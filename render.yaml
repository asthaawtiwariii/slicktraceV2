services:
  # Unified Full-Stack SlickTrace Web Service (FastAPI + React 19 Frontend)
  - type: web
    name: slicktrace-app
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd ..
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_PATH
        value: data/slicktrace.duckdb
      - key: HOST
        value: 0.0.0.0
